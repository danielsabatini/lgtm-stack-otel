apiVersion: 1

datasources:
  # --- PROMETHEUS (MIMIR) ---
  - name: Mimir
    type: prometheus
    uid: mimir
    url: http://mimir:9009/prometheus
    access: proxy
    isDefault: true
    jsonData:
      httpMethod: POST
      prometheusType: Mimir
      manageAlerts: true
      # Maior intervalo de coleta da stack (receivers de banco e coletas pull):
      # $__rate_interval = max(intervalo + 60s, 4 x 60s), garantindo amostras
      # suficientes no rate() de qualquer fonte.
      timeInterval: "60s"
      # Querying incremental: reutiliza cache de janelas anteriores em ranges longos (v13+)
      incrementalQuerying: true
      incrementalQueryOverlapWindow: "10m"
      # Link Exemplar -> Trace (clique em exemplar no gráfico abre o trace no Tempo)
      # Exemplars OTLP: o Mimir grava o TraceId do exemplar no label "trace_id"
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: tempo

  # --- LOKI ---
  - name: Loki
    type: loki
    uid: loki
    url: http://loki:3100
    access: proxy
    jsonData:
      # Link direto Log -> Trace
      derivedFields:
        # Logs OTLP: trace_id chega como structured metadata (OTel Logs Data Model)
        - datasourceUid: tempo
          matcherType: label
          matcherRegex: "trace_id"
          name: TraceID
          url: "$${__value.raw}"
          urlDisplayLabel: "Ver trace no Tempo"
        # Logs legados (Loki push): trace_id=<id> no texto da linha
        - datasourceUid: tempo
          matcherRegex: "trace_id=(\\w+)"
          name: TraceIDLine
          url: "$${__value.raw}"
          urlDisplayLabel: "Ver trace no Tempo"

  # --- TEMPO ---
  - name: Tempo
    type: tempo
    uid: tempo
    url: http://tempo:3200
    access: proxy
    jsonData:
      httpMethod: GET
      # Desabilita streaming gRPC (endpoint 3200 do Tempo serve apenas HTTP)
      streamingEnabled:
        search: false
        metrics: false
      # Link Trace -> Logs (formato v2, mais completo)
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: "-1m"
        spanEndTimeShift: "1m"
        filterByTraceID: false
        filterBySpanID: false
        # trace_id é structured metadata nos logs OTLP (não está no texto da linha)
        customQuery: true
        query: '{service_name="$${__span.tags["service.name"]}"} | trace_id="$${__trace.traceId}"'
      # Service Map via Mimir (métricas traces_service_graph_* emitidas pelos agents)
      serviceMap:
        datasourceUid: mimir
      nodeGraph:
        enabled: true
