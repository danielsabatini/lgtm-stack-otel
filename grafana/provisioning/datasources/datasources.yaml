apiVersion: 1

datasources:
  # --- PROMETHEUS (MIMIR) ---
  - name: Mimir
    type: prometheus
    uid: mimir
    url: http://mimir:9009/prometheus
    access: proxy
    isDefault: true
    jsonData:
      httpMethod: POST
      prometheusType: Mimir
      manageAlerts: true
      # Querying incremental: reutiliza cache de janelas anteriores em ranges longos (v13+)
      incrementalQuerying: true
      incrementalQueryOverlapWindow: "10m"
      # Link Exemplar -> Trace (clique em exemplar no gráfico abre o trace no Tempo)
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: tempo

  # --- LOKI ---
  - name: Loki
    type: loki
    uid: loki
    url: http://loki:3100
    access: proxy
    jsonData:
      # Link direto Log -> Trace
      derivedFields:
        - datasourceUid: tempo
          matcherRegex: "trace_id=(\\w+)"
          name: TraceID
          url: "$${__value.raw}"
          urlDisplayLabel: "Ver trace no Tempo"

  # --- TEMPO ---
  - name: Tempo
    type: tempo
    uid: tempo
    url: http://tempo:3200
    access: proxy
    jsonData:
      httpMethod: GET
      # Desabilita streaming gRPC (endpoint 3200 do Tempo serve apenas HTTP)
      streamingEnabled:
        search: false
        metrics: false
      # Link Trace -> Logs (formato v2, mais completo)
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: "-1m"
        spanEndTimeShift: "1m"
        filterByTraceID: true
        filterBySpanID: false
        customQuery: false
      # Link Trace -> Métricas (Service Graph via Mimir)
      tracesToMetrics:
        datasourceUid: mimir
        spanStartTimeShift: "-1m"
        spanEndTimeShift: "1m"
        queries:
          - name: "Request rate"
            query: "rate(traces_spanmetrics_calls_total{$$__tags}[5m])"
          - name: "Request duration p95"
            query: "histogram_quantile(0.95, sum(rate(traces_spanmetrics_duration_milliseconds_bucket{$$__tags}[5m])) by (le))"
      # Service Map via Mimir
      serviceMap:
        datasourceUid: mimir
      nodeGraph:
        enabled: true
