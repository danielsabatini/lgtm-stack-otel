# Monolito single-tenant: todos os componentes num único processo, sem X-Scope-OrgID
target: all
multitenancy_enabled: false

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318
        grpc:
          endpoint: 0.0.0.0:4317

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
    wal:
      path: /var/tempo/wal

backend_scheduler:
  provider:
    compaction:
      compaction:
        block_retention: ${TEMPO_RETENTION}
        compaction_window: 1h

backend_worker:
  compaction:
    block_retention: ${TEMPO_RETENTION}
    compaction_window: 1h
