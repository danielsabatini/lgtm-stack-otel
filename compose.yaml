name: lgtm-stack

services:
  # --- BACKENDS (Bases de Dados) ---

  loki:
    image: grafana/loki:${GRAFANA_LOKI_VERSION:-3.7.1}
    container_name: loki
    restart: unless-stopped
    user: "10001:10001"
    environment:
      - LOKI_RETENTION=${LOKI_RETENTION:-30d}
    # Portas omitidas por segurança.
    # Como o Alloy é o gateway de ingestão e o Grafana a leitura, os backends
    # não devem ser expostos na rede do Host. O tráfego flui pela rede interna 'lgtm'.
    # ports:
    #   - "3100:3100"
    volumes:
      - loki-data:/loki
      - ./loki/loki.yaml:/etc/loki/local-config.yaml:ro
    command: ["-config.file=/etc/loki/local-config.yaml", "-config.expand-env=true"]
    # Imagem distroless: sem shell nem wget. Healthcheck desabilitado — restart: unless-stopped
    # garante reinicialização automática em caso de crash.
    healthcheck:
      disable: true
    networks:
      - lgtm
    deploy:
      resources:
        limits:
          cpus: '${LOKI_CPUS:-2.0}'
          memory: ${LOKI_MEMORY:-6GB}

  mimir:
    image: grafana/mimir:${GRAFANA_MIMIR_VERSION:-3.0.5}
    container_name: mimir
    restart: unless-stopped
    user: "10001:10001"
    environment:
      - MIMIR_RETENTION=${MIMIR_RETENTION:-30d}
    # Portas omitidas por segurança.
    # Como o Alloy é o gateway de ingestão e o Grafana a leitura, os backends
    # não devem ser expostos na rede do Host. O tráfego flui pela rede interna 'lgtm'.
    # ports:
    #   - "9009:9009"
    volumes:
      - mimir-data:/data
      - ./mimir/mimir.yaml:/etc/mimir.yaml:ro
    command: ["-config.file=/etc/mimir.yaml", "-config.expand-env=true"]
    # Imagem distroless: sem shell nem wget. Healthcheck desabilitado — restart: unless-stopped
    # garante reinicialização automática em caso de crash.
    healthcheck:
      disable: true
    networks:
      - lgtm
    deploy:
      resources:
        limits:
          cpus: '${MIMIR_CPUS:-2.0}'
          memory: ${MIMIR_MEMORY:-8GB}

  tempo:
    image: grafana/tempo:${GRAFANA_TEMPO_VERSION:-2.10.3}
    container_name: tempo
    restart: unless-stopped
    user: "10001:10001"
    environment:
      - TEMPO_RETENTION=${TEMPO_RETENTION:-336h}
    # Portas omitidas por segurança.
    # Como o Alloy é o gateway de ingestão e o Grafana a leitura, os backends
    # não devem ser expostos na rede do Host. O tráfego flui pela rede interna 'lgtm'.
    # ports:
    #   - "3200:3200"
    volumes:
      - tempo-data:/var/tempo
      - ./tempo/tempo.yaml:/etc/tempo.yaml:ro
    command: ["-config.file=/etc/tempo.yaml", "-config.expand-env=true"]
    # Imagem distroless: sem shell nem wget. Healthcheck desabilitado — restart: unless-stopped
    # garante reinicialização automática em caso de crash.
    healthcheck:
      disable: true
    networks:
      - lgtm
    deploy:
      resources:
        limits:
          cpus: '${TEMPO_CPUS:-2.0}'
          memory: ${TEMPO_MEMORY:-6GB}

  # --- FRONTEND E COLETOR (Dependem dos Backends) ---

  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-12.4.2}
    container_name: grafana
    restart: unless-stopped
    user: "472:0"
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD:-changeme}
    networks:
      - lgtm
    depends_on:
      - loki
      - mimir
      - tempo
    deploy:
      resources:
        limits:
          cpus: '${GRAFANA_CPUS:-1.0}'
          memory: ${GRAFANA_MEMORY:-4GB}

  alloy-gateway:
    image: grafana/alloy:${GRAFANA_ALLOY_VERSION:-v1.15.0}
    container_name: alloy-gateway
    restart: unless-stopped
    volumes:
      - ./alloy-gateway/conf.d:/etc/alloy/conf.d:ro
      - alloy-gateway-data:/var/lib/alloy/data
    command: ["run", "--storage.path=/var/lib/alloy/data", "--server.http.listen-addr=0.0.0.0:12345", "/etc/alloy/conf.d/"]
    ports:
      - "12345:12345"  # UI do Alloy Gateway
      - "4317:4317"    # OTLP gRPC (traces/metrics das aplicações)
      - "4318:4318"    # OTLP HTTP (traces/metrics das aplicações)
    depends_on:
      - loki
      - mimir
      - tempo
    networks:
      - lgtm
    deploy:
      resources:
        limits:
          cpus: '${ALLOY_GATEWAY_CPUS:-1.0}'
          memory: ${ALLOY_GATEWAY_MEMORY:-2GB}

  alloy-agent:
    image: grafana/alloy:${GRAFANA_ALLOY_VERSION:-v1.15.0}
    container_name: alloy-agent
    restart: unless-stopped
    privileged: true  # Necessário para leitura do /proc, /sys e journal do host
    user: root
    pid: host
    environment:
      - HOSTNAME=code
    volumes:
      - ./alloy-agent/config.alloy:/etc/alloy/config.alloy:ro
      - /var/log/journal:/var/log/journal:ro
      - /run/systemd/journal/socket:/run/systemd/journal/socket
      - /:/host:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /run/containerd/containerd.sock:/run/containerd/containerd.sock:ro
      - /docker:/docker:ro
      - alloy-agent-data:/var/lib/alloy/data
    command: ["run", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    depends_on:
      - alloy-gateway
    networks:
      - lgtm
    deploy:
      resources:
        limits:
          cpus: '${ALLOY_AGENT_CPUS:-0.5}'
          memory: ${ALLOY_AGENT_MEMORY:-1GB}

networks:
  lgtm:
    name: lgtm
    driver: bridge

volumes:
  grafana-data:
    external: true
  loki-data:
    external: true
  mimir-data:
    external: true
  tempo-data:
    external: true
  alloy-gateway-data:
    external: true
  alloy-agent-data:
    external: true
