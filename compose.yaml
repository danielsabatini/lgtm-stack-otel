name: lgtm-stack

services:
  # --- BACKENDS (Bases de Dados) ---

  loki:
    image: grafana/loki:3.7.1
    container_name: loki
    restart: unless-stopped
    user: "10001:10001"
    environment:
      - LOKI_RETENTION=${LOKI_RETENTION:-30d}
    # Portas omitidas por segurança.
    # Como o Alloy é o gateway de ingestão e o Grafana a leitura, os backends 
    # não devem ser expostos na rede do Host. O tráfego flui pela rede interna 'lgtm'.
    # ports:
    #   - "3100:3100"
    volumes:
      - loki-data:/loki
      - ./loki/loki.yaml:/etc/loki/local-config.yaml:ro
    command: -config.file=/etc/loki/local-config.yaml
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - lgtm
    deploy:
      resources:
        limits:
          cpus: '${LOKI_CPUS:-2.0}'
          memory: ${LOKI_MEMORY:-6GB}

  mimir:
    image: grafana/mimir:3.0.5
    container_name: mimir
    restart: unless-stopped
    user: "10001:10001"
    environment:
      - MIMIR_RETENTION=${MIMIR_RETENTION:-30d}
    # Portas omitidas por segurança.
    # Como o Alloy é o gateway de ingestão e o Grafana a leitura, os backends 
    # não devem ser expostos na rede do Host. O tráfego flui pela rede interna 'lgtm'.
    # ports:
    #   - "9009:9009"
    volumes:
      - mimir-data:/data
      - ./mimir/mimir.yaml:/etc/mimir.yaml:ro
    command: ["-config.file=/etc/mimir.yaml"]
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9009/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - lgtm
    deploy:
      resources:
        limits:
          cpus: '${MIMIR_CPUS:-2.0}'
          memory: ${MIMIR_MEMORY:-8GB}

  tempo:
    image: grafana/tempo:2.10.3
    container_name: tempo
    restart: unless-stopped
    user: "10001:10001"
    environment:
      - TEMPO_RETENTION=${TEMPO_RETENTION:-336h}
    # Portas omitidas por segurança.
    # Como o Alloy é o gateway de ingestão e o Grafana a leitura, os backends 
    # não devem ser expostos na rede do Host. O tráfego flui pela rede interna 'lgtm'.
    # ports:
    #   - "3200:3200"
    volumes:
      - tempo-data:/var/tempo
      - ./tempo/tempo.yaml:/etc/tempo.yaml:ro
    command: ["-config.file=/etc/tempo.yaml"]
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3200/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - lgtm
    deploy:
      resources:
        limits:
          cpus: '${TEMPO_CPUS:-2.0}'
          memory: ${TEMPO_MEMORY:-6GB}

  # --- FRONTEND E COLETOR (Dependem dos Backends) ---

  grafana:
    image: grafana/grafana:12.4.2
    container_name: grafana
    restart: unless-stopped
    user: "472:0"
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD:-changeme}
    networks:
      - lgtm
    depends_on:
      loki:
        condition: service_healthy
      mimir:
        condition: service_healthy
      tempo:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '${GRAFANA_CPUS:-1.0}'
          memory: ${GRAFANA_MEMORY:-4GB}

  alloy-gateway:
    image: grafana/alloy:1.15.0
    container_name: alloy-gateway
    restart: unless-stopped
    volumes:
      - ./alloy-gateway/conf.d:/etc/alloy/conf.d:ro
      - alloy-gateway-data:/var/lib/alloy/data
    command: ["run", "--storage.path=/var/lib/alloy/data", "/etc/alloy/conf.d/"]
    ports:
      - "12345:12345"  # UI do Alloy Gateway
      - "4317:4317"    # OTLP gRPC (traces/metrics das aplicações)
      - "4318:4318"    # OTLP HTTP (traces/metrics das aplicações)
    depends_on:
      loki:
        condition: service_healthy
      mimir:
        condition: service_healthy
      tempo:
        condition: service_healthy
    networks:
      - lgtm
    deploy:
      resources:
        limits:
          cpus: '${ALLOY_GATEWAY_CPUS:-1.0}'
          memory: ${ALLOY_GATEWAY_MEMORY:-2GB}

  alloy-agent:
    image: grafana/alloy:1.15.0
    container_name: alloy-agent
    restart: unless-stopped
    privileged: true  # Necessário para leitura do /proc, /sys e journal do host
    user: root
    volumes:
      - ./alloy-agent/config.alloy:/etc/alloy/config.alloy:ro
      - /var/log/journal:/var/log/journal:ro
      - /run/systemd/journal/socket:/run/systemd/journal/socket
      - /:/host:ro,rslave
      - alloy-agent-data:/var/lib/alloy/data
    command: ["run", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    depends_on:
      - alloy-gateway
    networks:
      - lgtm
    deploy:
      resources:
        limits:
          cpus: '${ALLOY_AGENT_CPUS:-0.5}'
          memory: ${ALLOY_AGENT_MEMORY:-1GB}

networks:
  lgtm:
    name: lgtm
    driver: bridge

volumes:
  grafana-data:
    external: true
  loki-data:
    external: true
  mimir-data:
    external: true
  tempo-data:
    external: true
  alloy-gateway-data:
    external: true
  alloy-agent-data:
    external: true
