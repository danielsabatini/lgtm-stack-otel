name: lgtm-stack-otel

# Logs dos containers da stack: driver json-file (lido pelo otel-agent) com
# rotação, gravando o nome do serviço em cada linha (vira service.name).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
    labels: com.docker.compose.service

services:
  loki:
    image: grafana/loki:${GRAFANA_LOKI_VERSION:-3.7.8}
    container_name: loki
    hostname: loki
    restart: unless-stopped
    logging: *default-logging
    user: "10001:10001"
    environment:
      - LOKI_RETENTION=${LOKI_RETENTION:-30d}
    # ports:
    #   - "3100:3100"
    volumes:
      - loki-data:/loki
      - ./loki/loki.yaml:/etc/loki/local-config.yaml:ro
    command: ["-config.file=/etc/loki/local-config.yaml", "-config.expand-env=true"]
    healthcheck:
      disable: true
    networks:
      - lgtm
    deploy:
      resources:
        limits:
          cpus: '${LOKI_CPUS:-2.0}'
          memory: ${LOKI_MEMORY:-6GB}

  mimir:
    image: grafana/mimir:${GRAFANA_MIMIR_VERSION:-3.2.1}
    container_name: mimir
    hostname: mimir
    restart: unless-stopped
    logging: *default-logging
    environment:
      - MIMIR_RETENTION=${MIMIR_RETENTION:-30d}
    # ports:
    #   - "9009:9009"
    volumes:
      - mimir-data:/data
      - ./mimir/mimir.yaml:/etc/mimir.yaml:ro
    command: ["-config.file=/etc/mimir.yaml", "-config.expand-env=true"]
    healthcheck:
      disable: true
    networks:
      - lgtm
    deploy:
      resources:
        limits:
          cpus: '${MIMIR_CPUS:-2.0}'
          memory: ${MIMIR_MEMORY:-8GB}

  tempo:
    image: grafana/tempo:${GRAFANA_TEMPO_VERSION:-3.1.0}
    container_name: tempo
    hostname: tempo
    restart: unless-stopped
    logging: *default-logging
    user: "10001:10001"
    environment:
      - TEMPO_RETENTION=${TEMPO_RETENTION:-336h}
    # ports:
    #   - "3200:3200"
    volumes:
      - tempo-data:/var/tempo
      - ./tempo/tempo.yaml:/etc/tempo.yaml:ro
    command: ["-config.file=/etc/tempo.yaml", "-config.expand-env=true"]
    healthcheck:
      disable: true
    networks:
      - lgtm
    deploy:
      resources:
        limits:
          cpus: '${TEMPO_CPUS:-2.0}'
          memory: ${TEMPO_MEMORY:-6GB}

  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-13.2.3}
    container_name: grafana
    hostname: grafana
    restart: unless-stopped
    logging: *default-logging
    user: "472:0"
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD:-changeme}
    networks:
      - lgtm
    depends_on:
      - loki
      - mimir
      - tempo
    deploy:
      resources:
        limits:
          cpus: '${GRAFANA_CPUS:-1.0}'
          memory: ${GRAFANA_MEMORY:-4GB}

  otel-gateway:
    image: otel/opentelemetry-collector-contrib:${OTELCOL_CONTRIB_VERSION:-0.162.0}
    container_name: otel-gateway
    hostname: otel-gateway
    restart: unless-stopped
    logging: *default-logging
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-prd}
    volumes:
      - ./otel-gateway/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    healthcheck:
      disable: true
    ports:
      - "13133:13133"  # Health check do Gateway (health_check extension)
      - "4317:4317"    # OTLP gRPC (traces, métricas e logs — agents e aplicações)
      - "4318:4318"    # OTLP HTTP (traces, métricas e logs — agents e aplicações)
    depends_on:
      - loki
      - mimir
      - tempo
    networks:
      - lgtm
    deploy:
      resources:
        limits:
          cpus: '${OTEL_GATEWAY_CPUS:-1.0}'
          memory: ${OTEL_GATEWAY_MEMORY:-2GB}

  otel-agent:
    build:
      context: ./otel-agent
      args:
        OTELCOL_CONTRIB_VERSION: ${OTELCOL_CONTRIB_VERSION:-0.162.0}
    image: lgtm-stack/otel-agent:${OTELCOL_CONTRIB_VERSION:-0.162.0}
    container_name: otel-agent
    restart: unless-stopped
    logging: *default-logging
    # Enxerga a rede e os processos do HOST (não os do container).
    network_mode: host
    pid: host
    # root apenas para ler socket do Docker, journal e logs de containers
    # (arquivos do root); sem nenhuma capability e sem escalonamento.
    user: "0:0"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges=true"]
    environment:
      # Identidade OpenTelemetry deste servidor (OTel Semantic Conventions)
      # host.name fixo (o detector env vem antes do system em otel-agent/config.yaml)
      - OTEL_RESOURCE_ATTRIBUTES=host.name=${LGTM_HOST_NAME:-lgtm-stack},deployment.environment.name=${ENVIRONMENT:-prd},cloud.provider=${CLOUD_PROVIDER:-mgc},cloud.region=${CLOUD_REGION:-br-se1},cloud.availability_zone=${CLOUD_AVAILABILITY_ZONE:-a}
      # otel-gateway publicado no host (network_mode: host)
      - LGTM_GATEWAY_ENDPOINT=127.0.0.1:4317
      # Métricas de containers só deste projeto compose (filter/stack_containers)
      - LGTM_COMPOSE_PROJECT=${COMPOSE_PROJECT_NAME:-lgtm-stack-otel}
    volumes:
      - ./otel-agent/config.yaml:/etc/otelcol-contrib/config.yaml:ro
      # Conversão das coletas pull para a OTel Semantic Conventions (processors compartilhados)
      - ./otel-agent/pull-semconv.yaml:/etc/otelcol-contrib/pull-semconv.yaml:ro
      # Coletas pull de servidores legados (templates em examples/pull/)
      - ./otel-agent/pull.d:/etc/otelcol-contrib/pull.d:ro
      - otel-agent-data:/var/lib/otelcol
      # Métricas de host (host_metrics root_path)
      - /:/hostfs:ro
      # Métricas e logs de containers
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${DOCKER_DATA_ROOT:-/var/lib/docker}/containers:/var/lib/docker/containers:ro
      # Logs do host (journald)
      - /var/log/journal:/var/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
    healthcheck:
      disable: true
    depends_on:
      - otel-gateway
    deploy:
      resources:
        limits:
          cpus: '${OTEL_AGENT_CPUS:-0.5}'
          memory: ${OTEL_AGENT_MEMORY:-512MB}

networks:
  lgtm:
    name: lgtm
    driver: bridge

volumes:
  grafana-data:
  otel-agent-data:
  loki-data:
  mimir-data:
  tempo-data: