module "kubernetes_cluster" {
  source          = "../../tf-modules/kubernetes_cluster"
  name            = "homol-toolzz"
  cluster_version = var.k8s_cluster_version
  description     = "Development Kubernetes cluster"
}

module "kubernetes_nodepool" {
  source = "../../tf-modules/kubernetes_nodepool"

  cluster_id = module.kubernetes_cluster.cluster_id

  nodepools = {
    alpha = {
      name               = "alpha"
      flavor_name        = "DP8-16-40"
      replicas           = 1
      min_replicas       = 1
      max_replicas       = 4
      availability_zones = ["br-se1-a", "br-se1-b"]
    }
    bravo = {
      name               = "bravo"
      flavor_name        = "BV4-8-40"
      replicas           = 1
      min_replicas       = 1
      max_replicas       = 6
      availability_zones = ["br-se1-a", "br-se1-b"]
    }
    charlie = {
      name               = "charlie"
      flavor_name        = "BV4-8-40"
      replicas           = 1
      min_replicas       = 1
      max_replicas       = 6
      availability_zones = ["br-se1-a", "br-se1-b"]
    }
    dragoon = {
      name               = "dragoon"
      flavor_name        = "L40Sx1-DP8-64-100"
      replicas           = 2
      min_replicas       = 1
      max_replicas       = 3
      availability_zones = ["br-se1-a"]
    }
  }
}
.