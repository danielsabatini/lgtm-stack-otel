target: all
multitenancy_enabled: false

activity_tracker:
  filepath: /data/metrics-activity.log

server:
  http_listen_port: 9009
  grpc_listen_port: 9095

common:
  storage:
    backend: filesystem
    filesystem:
      dir: /data/storage

blocks_storage:
  storage_prefix: blocks
  tsdb:
    dir: /data/tsdb
  bucket_store:
    sync_dir: /data/tsdb-sync

compactor:
  data_dir: /data/compactor

ruler_storage:
  backend: filesystem
  filesystem:
    dir: /data/ruler

ruler:
  rule_path: /data/ruler-temp

ingester:
  ring:
    kvstore:
      store: inmemory
    replication_factor: 1

limits:
  compactor_blocks_retention_period: ${MIMIR_RETENTION}
  out_of_order_time_window: 10m
