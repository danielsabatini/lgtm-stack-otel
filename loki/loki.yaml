# Monolito single-tenant: todos os componentes num único processo, sem X-Scope-OrgID
target: all
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: info

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb       # Recomendação oficial atualizada
      object_store: filesystem
      schema: v13       # Versão mais estável para 2026
      index:
        prefix: index_
        period: 24h

limits_config:
  discover_log_levels: false
  allow_structured_metadata: true
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  max_cache_freshness_per_query: 10m
  retention_period: ${LOKI_RETENTION}

  # OTLP nativo (endpoint /otlp/v1/logs): resource attributes da OTel Semantic
  # Conventions que viram index labels (pontos convertidos para underscore, ex.:
  # host.name -> host_name). Somam-se aos defaults do Loki (service.name,
  # service.namespace, service.instance.id, deployment.environment.name,
  # cloud.region, cloud.availability_zone, k8s.*). Demais atributos, trace_id,
  # span_id e severity_text ficam como structured metadata.
  otlp_config:
    resource_attributes:
      attributes_config:
        - action: index_label
          attributes:
            - host.name
            - cloud.provider

compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 50
  delete_request_store: filesystem