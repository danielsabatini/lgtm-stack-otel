# =============================================================================
# OpenTelemetry Collector (contrib) — Agent Linux + PostgreSQL
# =============================================================================
# Arquivo: /etc/otelcol-contrib/config.yaml   (serviço: otelcol-contrib)
#
# Mesma base do template examples/push/linux/config.yaml (host + journald),
# acrescida do PostgreSQL — mantenha a parte de host idêntica (o script
# artifacts/scripts/check-examples-consistency.py confere):
#   - Métricas de host .......... host_metrics  (system.*)
#   - Logs do journald .......... journald      (ssh, kernel, cron, systemd)
#   - Métricas do PostgreSQL .... postgresql    (postgresql.*, receiver nativo OTel)
#   - Log do PostgreSQL ......... file_log      (/var/log/postgresql/postgresql-*.log)
#   - Traces + métricas HTTP .... OBI (opcional, serviço obi) -> OTLP 127.0.0.1:4317
#   - Self-monitoring ........... telemetria interna -> OTLP 127.0.0.1:4317
#
# OBRIGATÓRIO: o receiver postgresql roda com o feature gate
# receiver.postgresql.useOTelSemconv (Alpha), que emite UM resource por
# servidor e o banco no atributo db.namespace (OTel Semantic Conventions).
# Sem ele, o banco fica só no resource e as séries de bancos diferentes se
# misturam no Mimir. Em /etc/otelcol-contrib/otelcol-contrib.conf:
#   OTELCOL_OPTIONS="--config=/etc/otelcol-contrib/config.yaml --feature-gates=+receiver.postgresql.useOTelSemconv"
#
# Identidade, Gateway e credencial (NUNCA neste arquivo), no mesmo .conf:
#   OTEL_RESOURCE_ATTRIBUTES="deployment.environment.name=prd,cloud.provider=mgc,cloud.region=br-se1,cloud.availability_zone=a"
#   LGTM_GATEWAY_ENDPOINT=lgtm-stack:4317
#   PG_MONITOR_USER=otel_monitor
#   PG_MONITOR_PASSWORD=<senha>
#
# Política Lean: coletar e armazenar apenas o necessário. Cada métrica e cada
# fonte de log abaixo é explícita; o que não está listado não é coletado.
# =============================================================================

receivers:
  # Entrada local do OBI e do self-monitoring. Só loopback: o agente não
  # expõe portas na rede.
  otlp:
    protocols:
      grpc:
        endpoint: 127.0.0.1:4317

  # ---------------------------------------------------------------------------
  # MÉTRICAS DE HOST (nomes system.* da OTel Semantic Conventions)
  # ---------------------------------------------------------------------------
  # Os atributos seguem a versão emitida pelo receiver (ex.: state, direction,
  # device): as system semantic conventions estão em "Development" e a
  # especificação orienta as instrumentações a não adotar breaking changes
  # antes de estabilizar.
  host_metrics:
    collection_interval: 30s
    scrapers:
      cpu:
        metrics:
          system.cpu.time: { enabled: true }
      load:
        metrics:
          system.cpu.load_average.1m: { enabled: true }
          system.cpu.load_average.5m: { enabled: true }
          system.cpu.load_average.15m: { enabled: true }
      memory:
        metrics:
          system.memory.usage: { enabled: true }
          system.memory.limit: { enabled: true }
      paging:
        metrics:
          system.paging.usage: { enabled: true }
          system.paging.faults: { enabled: false }
          system.paging.operations: { enabled: false }
      disk:
        # Ignora dispositivos sem valor operacional (loop, ram, cd, device-mapper)
        exclude:
          devices: ["^(loop|ram|fd|sr)[0-9]*$", "^dm-[0-9]+$"]
          match_type: regexp
        metrics:
          system.disk.io: { enabled: true }
          system.disk.operations: { enabled: true }
          system.disk.operation_time: { enabled: true }
          system.disk.io_time: { enabled: true }
          system.disk.merged: { enabled: false }
          system.disk.pending_operations: { enabled: false }
          system.disk.weighted_io_time: { enabled: false }
      filesystem:
        # Ignora pseudo-filesystems (sem valor operacional, só cardinalidade)
        exclude_fs_types:
          fs_types: [autofs, binfmt_misc, bpf, cgroup2, configfs, debugfs, devpts, devtmpfs, fusectl, hugetlbfs, mqueue, nsfs, overlay, proc, procfs, pstore, rpc_pipefs, securityfs, selinuxfs, squashfs, sysfs, tracefs, tmpfs]
          match_type: strict
        metrics:
          system.filesystem.usage: { enabled: true }
          system.filesystem.inodes.usage: { enabled: true }
      network:
        # Ignora interfaces virtuais (loopback, docker, veth, bridges)
        exclude:
          interfaces: ["^lo$", "^docker.*", "^veth.*", "^br-.*", "^virbr.*"]
          match_type: regexp
        metrics:
          system.network.io: { enabled: true }
          system.network.dropped: { enabled: true }
          system.network.errors: { enabled: true }
          system.network.packets: { enabled: false }
          system.network.connections: { enabled: false }
      system:
        metrics:
          system.uptime: { enabled: true }

  # ---------------------------------------------------------------------------
  # LOGS DO JOURNALD (OTel Logs Data Model)
  # ---------------------------------------------------------------------------
  # Cada fonte filtra na origem (priority = severidade mínima do journalctl).
  # Os operadores comuns (âncora &journal_operators) convertem a entrada do
  # journal em log record OTel: PRIORITY -> SeverityNumber/SeverityText,
  # _PID/_COMM -> process.pid/process.executable.name, MESSAGE -> Body.
  journald/ssh:
    units: [ssh.service]
    priority: info
    resource:
      service.name: ssh
    attributes:
      category: security
    operators: &journal_operators
      - type: severity_parser
        parse_from: body.PRIORITY
        # SeverityText recebe o nome OTel (WARN, ERROR...), não o número syslog
        overwrite_text: true
        mapping:
          fatal: ["0", "1", "2"]
          error: "3"
          warn: "4"
          info2: "5"
          info: "6"
          debug: "7"
      - type: move
        if: body._PID != nil
        from: body._PID
        to: attributes["process.pid"]
      - type: move
        if: body._COMM != nil
        from: body._COMM
        to: attributes["process.executable.name"]
      - type: move
        from: body.MESSAGE
        to: body

  journald/kernel:
    matches:
      - _TRANSPORT: kernel
    priority: warning
    resource:
      service.name: kernel
    attributes:
      category: system
    operators: *journal_operators

  journald/cron:
    units: [cron.service]
    priority: warning
    resource:
      service.name: cron
    attributes:
      category: application
    operators: *journal_operators

  journald/systemd:
    matches:
      - SYSLOG_IDENTIFIER: systemd
    priority: warning
    resource:
      service.name: systemd
    attributes:
      category: platform
    operators: *journal_operators

  # ---------------------------------------------------------------------------
  # MÉTRICAS DO POSTGRESQL (receiver nativo OpenTelemetry, nomes postgresql.*)
  # ---------------------------------------------------------------------------
  # Usuário com a role padrão pg_monitor (somente leitura de estatísticas).
  # Apenas métricas no nível de BANCO (atributo db.namespace): as métricas por
  # tabela/índice (padrão do receiver) crescem com o número de tabelas.
  postgresql:
    endpoint: localhost:5432
    transport: tcp
    username: ${env:PG_MONITOR_USER}
    password: ${env:PG_MONITOR_PASSWORD}
    collection_interval: 60s
    tls:
      # Conexão local (localhost). Para servidor remoto, habilite TLS.
      insecure: true
    resource_attributes:
      db.system.version: { enabled: true }
    metrics:
      # Conexões (saturação = backends / connection.max)
      postgresql.backends: { enabled: true }
      postgresql.connection.max: { enabled: true }
      # Transações e throughput
      postgresql.commits: { enabled: true }
      postgresql.rollbacks: { enabled: true }
      postgresql.tup_fetched: { enabled: true }
      postgresql.tup_returned: { enabled: true }
      postgresql.tup_inserted: { enabled: true }
      postgresql.tup_updated: { enabled: true }
      postgresql.tup_deleted: { enabled: true }
      # Contenção e diagnóstico
      postgresql.deadlocks: { enabled: true }
      postgresql.temp.io: { enabled: true }
      # Cache (hit ratio = blks_hit / (blks_hit + blks_read))
      postgresql.blks_hit: { enabled: true }
      postgresql.blks_read: { enabled: true }
      # Capacidade
      postgresql.db_size: { enabled: true }
      postgresql.bgwriter.checkpoint.count: { enabled: true }
      # Desligadas (Lean): por tabela/índice (cardinalidade cresce com o schema)
      postgresql.blocks_read: { enabled: false }
      postgresql.operations: { enabled: false }
      postgresql.rows: { enabled: false }
      postgresql.index.scans: { enabled: false }
      postgresql.index.size: { enabled: false }
      postgresql.table.count: { enabled: false }
      postgresql.table.size: { enabled: false }
      postgresql.table.vacuum.count: { enabled: false }
      # Desligadas (Lean): detalhes internos do background writer
      postgresql.bgwriter.buffers.allocated: { enabled: false }
      postgresql.bgwriter.buffers.writes: { enabled: false }
      postgresql.bgwriter.duration: { enabled: false }
      postgresql.bgwriter.maxwritten: { enabled: false }
      postgresql.database.count: { enabled: false }

  # ---------------------------------------------------------------------------
  # LOG DO POSTGRESQL
  # ---------------------------------------------------------------------------
  # log_min_messages=warning (padrão) já filtra na origem as mensagens de
  # servidor; o pipeline logs/postgresql descarta ainda os LOG/INFO rotineiros,
  # preservando as linhas "duration:" (slow query, se log_min_duration_statement
  # estiver habilitado).
  file_log/postgresql:
    include: [/var/log/postgresql/postgresql-*.log]
    start_at: end
    include_file_name: false
    include_file_path: true
    storage: file_storage
    resource:
      service.name: postgresql
    attributes:
      category: application
    operators:
      # Junta as linhas de continuação (DETAIL, HINT, STATEMENT, CONTEXT e
      # quebras de linha da query) à linha principal.
      - type: recombine
        combine_field: body
        is_first_entry: body matches '^\\d{4}-\\d{2}-\\d{2} \\d{2}:\\d{2}:\\d{2}\\.\\d+ \\S+ \\[\\d+\\] (\\S*@\\S* )?(DEBUG\\d|INFO|NOTICE|WARNING|ERROR|LOG|FATAL|PANIC):'
        combine_with: "\n"
      # Prefixo padrão do Debian: log_line_prefix = '%m [%p] %q%u@%d '
      - type: regex_parser
        regex: '^(?P<ts>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}\.\d+) (?P<tz>\S+) \[(?P<pid>\d+)\] (?:(?P<user>[^@\s]*)@(?P<db>\S*) )?(?P<level>[A-Z0-9]+):\s+(?P<message>(?s:.*))$'
        severity:
          parse_from: attributes.level
          overwrite_text: true
          mapping:
            fatal: [FATAL, PANIC]
            error: ERROR
            warn: WARNING
            info: [LOG, INFO, NOTICE]
            debug: [DEBUG1, DEBUG2, DEBUG3, DEBUG4, DEBUG5]
      # %m traz o fuso como abreviação (UTC) ou deslocamento curto (-03):
      # normaliza -03 -> -0300 antes do parsing.
      - type: add
        if: attributes.tz matches '^[+-]\\d{2}$'
        field: attributes.tz
        value: EXPR(attributes.tz + "00")
      - type: add
        field: attributes.time
        value: EXPR(attributes.ts + " " + attributes.tz)
      - type: time_parser
        if: attributes.tz matches '^[+-]\\d{4}$'
        parse_from: attributes.time
        layout_type: gotime
        layout: '2006-01-02 15:04:05.000 -0700'
      - type: time_parser
        if: not (attributes.tz matches '^[+-]\\d{4}$')
        parse_from: attributes.time
        layout_type: gotime
        layout: '2006-01-02 15:04:05.000 MST'
      - type: move
        from: attributes.message
        to: body
      - type: move
        from: attributes.pid
        to: attributes["process.pid"]
      - type: move
        if: attributes.user != nil and attributes.user != ""
        from: attributes.user
        to: attributes["user.name"]
      - type: move
        if: attributes.db != nil and attributes.db != ""
        from: attributes.db
        to: attributes["db.namespace"]
      - type: remove
        field: attributes.ts
      - type: remove
        field: attributes.tz
      - type: remove
        field: attributes.time
      - type: remove
        field: attributes.level
      - type: remove
        if: attributes.user != nil
        field: attributes.user
      - type: remove
        if: attributes.db != nil
        field: attributes.db
      - type: remove
        field: attributes["log.file.path"]

extensions:
  # Posição de leitura do log entre reinícios.
  file_storage:
    directory: /var/lib/otelcol-contrib/file_storage
    create_directory: true

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20

  # Identidade: OTEL_RESOURCE_ATTRIBUTES (env) + host.name/os.type (system).
  # override=true torna o Collector a fonte única da identidade do host: o OBI
  # usa o FQDN no host.name e as métricas/logs usam o hostname; sem isso o
  # mesmo host apareceria com dois nomes. Só são sobrescritos os atributos
  # detectados (host.name, os.type e os de OTEL_RESOURCE_ATTRIBUTES); o
  # service.name de cada serviço é preservado.
  resource_detection:
    detectors: [env, system]
    override: true
    system:
      hostname_sources: [os]

  # Métricas do postgresql receiver chegam sem service.name: identifica o serviço.
  resource/postgresql:
    attributes:
      - key: service.name
        value: postgresql
        action: upsert

  # Política Lean no log do PostgreSQL: só WARN+ e slow queries ("duration:").
  filter/postgresql_min_warn:
    error_mode: ignore
    logs:
      log_record:
        - 'severity_number < SEVERITY_NUMBER_WARN and not IsMatch(body, "^duration: ")'

  batch: {}

exporters:
  otlp_grpc/gateway:
    endpoint: ${env:LGTM_GATEWAY_ENDPOINT:-lgtm-stack:4317}
    tls:
      # TODO: ajuste conforme a política de TLS do seu ambiente.
      insecure: true

service:
  extensions: [file_storage]

  # Self-monitoring: métricas internas do Collector (nível basic = só o
  # essencial) em OTLP para o receiver local, recebendo a mesma identidade.
  telemetry:
    resource:
      attributes:
        - name: service.name
          value: otel-agent
    metrics:
      level: basic
      readers:
        - periodic:
            interval: 30000
            exporter:
              otlp:
                protocol: grpc
                endpoint: http://127.0.0.1:4317
                insecure: true

  pipelines:
    metrics:
      receivers: [host_metrics, otlp]
      processors: [memory_limiter, resource_detection, batch]
      exporters: [otlp_grpc/gateway]

    metrics/postgresql:
      receivers: [postgresql]
      processors: [memory_limiter, resource/postgresql, resource_detection, batch]
      exporters: [otlp_grpc/gateway]

    logs/postgresql:
      receivers: [file_log/postgresql]
      processors: [memory_limiter, filter/postgresql_min_warn, resource_detection, batch]
      exporters: [otlp_grpc/gateway]

    logs:
      receivers: [journald/ssh, journald/kernel, journald/cron, journald/systemd]
      processors: [memory_limiter, resource_detection, batch]
      exporters: [otlp_grpc/gateway]

    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource_detection, batch]
      exporters: [otlp_grpc/gateway]
