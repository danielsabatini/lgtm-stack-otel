l" data-id="L_Inventory_Health_0" transform="translate(-100, -24)"><foreignObject width="200" height="48"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="edgeLabel"><p>Fornece Denominador para Normalização</p></span></div></foreignObject></g></g><g class="edgeLabel" transform="translate(684.44004, 441.48565)"><g class="label" data-id="L_Inventory_Capacity_0" transform="translate(-100, -24)"><foreignObject width="200" height="48"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="edgeLabel"><p>Estabelece Teto para Cálculo de Margem</p></span></div></foreignObject></g></g></g><g class="nodes"><g class="root" transform="translate(35, 502.5)"><g class="clusters"><g class="cluster contextStyle" id="my-svg-OperationalViews" data-look="classic"><rect style="fill:#0f172a !important;stroke:#64748b !important;stroke-width:1px !important;stroke-dasharray:5 5 !important" x="8" y="8" width="920" height="484"/><g class="cluster-label" transform="translate(306.1796875, 8)"><foreignObject width="323.640625" height="24"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5;"><span class="nodeLabel" style="color:#cbd5e1 !important"><p>Perspectivas Complementares de Diagnóstico</p></span></div></foreignObject></g></g></g><g class="edgePaths"><path d="M318,206.821L343,198.518C368,190.214,418,173.607,467.367,173.397C516.735,173.187,565.469,189.374,589.837,197.467L614.204,205.561" id="my-svg-L_Health_Capacity_0" class="edge-thickness-normal edge-pattern-dotted edge-thickness-normal edge-pattern-solid flowchart-link" style=";" data-edge="true" data-et="edge" data-id="L_Health_Capacity_0" data-points="W3sieCI6MzE4LCJ5IjoyMDYuODIxNDI4NTcxNDI4NTZ9LHsieCI6NDY4LCJ5IjoxNTd9LHsieCI6NjE4LCJ5IjoyMDYuODIxNDI4NTcxNDI4NTZ9XQ==" data-look="classic" marker-end="url(#my-svg_flowchart-v2-pointEnd)"/><path d="M618,293.179L593,301.482C568,309.786,518,326.393,468.633,326.603C419.265,326.813,370.531,310.626,346.163,302.533L321.796,294.439" id="my-svg-L_Capacity_Health_0" class="edge-thickness-normal edge-pattern-dotted edge-thickness-normal edge-pattern-solid flowchart-link" style=";" data-edge="true" data-et="edge" data-id="L_Capacity_Health_0" data-points="W3sieCI6NjE4LCJ5IjoyOTMuMTc4NTcxNDI4NTcxNDR9LHsieCI6NDY4LCJ5IjozNDN9LHsieCI6MzE4LCJ5IjoyOTMuMTc4NTcxNDI4NTcxNDR9XQ==" data-look="classic" marker-end="url(#my-svg_flowchart-v2-pointEnd)"/></g><g class="edgeLabels"><g class="edgeLabel" transform="translate(468, 157)"><g class="label" data-id="L_Health_Capacity_0" transform="translate(-100, -36)"><foreignObject width="200" height="72"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="edgeLabel"><p>Detecta Saturação e Dispara Alarme<br /><i>(Quando agir?)</i></p></span></div></foreignObject></g></g><g class="edgeLabel" transform="translate(468, 343)"><g class="label" data-id="L_Capacity_Health_0" transform="translate(-100, -36)"><foreignObject width="200" height="72"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="edgeLabel"><p>Evidencia Composição e Folga Real<br /><i>(Onde agir e quanto resta?)</i></p></span></div></foreignObject></g></g></g><g class="nodes"><g class="node default healthStyle" id="my-svg-flowchart-Health-1" data-look="classic" transform="translate(188, 250)"><rect class="basic label-container" style="fill:#064e3b !important;stroke:#10b981 !important;stroke-width:2px !important" x="-130" y="-207" width="260" height="414"/><g class="label" style="color:#f8fafc !important" transform="translate(-100, -192)"><rect/><foreignObject width="200" height="384"><div style="color: rgb(248, 250, 252) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#f8fafc !important" class="nodeLabel"><p><b>2. USO PERCENTUAL % (Health)</b><br /><i>Sinal Vital e Alarme Imediato</i><br />• Pergunta: <i>'Qual a % ocupada agora?'</i><br />• Cálculo: <code>(Usado / Total) * 100</code><br />• Thresholds visuais portáteis (Verde / Amarelo / Vermelho)<br />• Disparo de alarmes imediatos (MTTD/MTTR)<br />• <b>Exemplo:</b> Uso de Memória = 80% (Alerta se &gt; 85%)</p></span></div></foreignObject></g></g><g class="node default capacityStyle" id="my-svg-flowchart-Capacity-2" data-look="classic" transform="translate(748, 250)"><rect class="basic label-container" style="fill:#4c1d95 !important;stroke:#8b5cf6 !important;stroke-width:2px !important" x="-130" y="-183" width="260" height="366"/><g class="label" style="color:#f8fafc !important" transform="translate(-100, -168)"><rect/><foreignObject width="200" height="336"><div style="color: rgb(248, 250, 252) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#f8fafc !important" class="nodeLabel"><p><b>3. FOLGA LIVRE (Capacity)</b><br /><i>Volume Real e Composição</i><br />• Pergunta: <i>'Quanto sobra? O que está gastando?'</i><br />• Cálculo: <code>Folga Livre = Total - Usado</code><br />• Composição detalhada por componente (bytes / contagem)<br />• Margem de manobra antes do esgotamento total<br />• <b>Exemplo:</b> Usado: 6.4 GB | Cache: 1.0 GB | Livre: 0.6 GB</p></span></div></foreignObject></g></g></g></g><g class="node default inventoryStyle" id="my-svg-flowchart-Inventory-0" data-look="classic" transform="translate(503, 216.5)"><rect class="basic label-container" style="fill:#1e293b !important;stroke:#3b82f6 !important;stroke-width:2px !important" x="-130" y="-171" width="260" height="342"/><g class="label" style="color:#f8fafc !important" transform="translate(-100, -156)"><rect/><foreignObject width="200" height="312"><div style="color: rgb(248, 250, 252) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#f8fafc !important" class="nodeLabel"><p><b>1. TOTAL DISPONÍVEL (Inventory)</b><br /><i>Teto Máximo e Configuração Estática</i><br />• Pergunta: <i>'Quanto existe no total instalado/configurado?'</i><br />• Denominador de referência (constante física/lógica)<br />• <b>Exemplo:</b> Memória Total: 8 GB | Limite de FDs: 65.536 conexões</p></span></div></foreignObject></g></g></g></g></g></g></g><defs><filter id="my-svg-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><defs><filter id="my-svg-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs></svg>